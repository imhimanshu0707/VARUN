[project]
name = "varun-detection-engine"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "numpy>=2,<3",
    "torch>=2.6,<3",
    "rasterio>=1.4,<2",
    "shapely>=2,<3",
    "pyproj>=3.7,<4",
    "matplotlib>=3.10,<4",
    "pillow>=11,<13",
    "varun-phase1-core"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1"
]

[tool.uv.sources]
varun-phase1-core = { path = "../../packages/python/phase1-core", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "../../packages/python/phase1-core/src"
]